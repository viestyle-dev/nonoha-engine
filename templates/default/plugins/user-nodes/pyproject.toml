[project]
name = "user-nodes"
version = "0.1.0"
description = "Custom user nodes for nonoha-engine"
requires-python = ">=3.11"
dependencies = [
    "numpy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["user_nodes"]

[tool.hatch.metadata]
allow-direct-references = true
